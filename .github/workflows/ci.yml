name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Install
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install -r requirements-dev.lock
          cd web && npm ci --no-audit --no-fund
      - name: Lint
        run: |
          ruff check .
          python scripts/authorship_lint.py
          cd web && npx prettier --check . && npx tsc --noEmit
      - name: Data and compile, twice, byte-identical
        run: make reproducible
      - name: dbt on DuckDB
        run: make dbt-local
      - name: Unit, API and evaluation suites
        run: |
          python -m pytest ontology/tests api/tests --cov --cov-fail-under=80 -q
          make governance-snapshot eval
      - name: Web export and browser checks
        run: |
          make web
          cd web && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: |
            eval/report.json
            eval/report.md
            web/tests/screenshots

  supply-chain:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Dependency audit, high severity blocks
        run: |
          pip install pip-audit cyclonedx-bom
          pip-audit --require-hashes -r requirements.lock --strict
          cd web && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: SBOM
        run: |
          cyclonedx-py requirements requirements.lock --output-format JSON -o sbom-python.cdx.json
          cd web && npx --yes @cyclonedx/cyclonedx-npm@1 --omit dev --output-file ../sbom-web.cdx.json
      - name: Build image
        run: docker build -t strata:${{ github.sha }} .
      - name: Scan image, high severity blocks
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 strata:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json
