scm_ontology:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: SCM_DEPLOY
      warehouse: SCM_WH_DEV
      database: SCM_DEV
      schema: STAGING
      threads: 4
    test:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: SCM_DEPLOY
      warehouse: SCM_WH_TEST
      database: SCM_TEST
      schema: STAGING
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: SCM_DEPLOY
      warehouse: SCM_WH_PROD
      database: SCM_PROD
      schema: STAGING
      threads: 4
    local:
      type: duckdb
      path: "{{ env_var('SCM_DUCKDB', 'target/scm.duckdb') }}"
      schema: conformed
      threads: 4
