name: scm_ontology
version: '1.0.0'
config-version: 2

profile: scm_ontology

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  fiscal_year_start_month: 10

models:
  scm_ontology:
    staging:
      +materialized: view
      +schema: STAGING
    conformed:
      +materialized: table
      +schema: CONFORMED
