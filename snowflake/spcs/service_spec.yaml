# Rendered by scripts/spcs.py: {{DB_LOWER}}, {{ENV}}, {{ENV_UPPER}} and {{TAG}} (short git sha) are substituted.
# No secrets: the container authenticates with the SPCS session token at /snowflake/session/token.
spec:
  containers:
    - name: strata
      image: /{{DB_LOWER}}/agent/image_repo/strata:{{TAG}}
      env:
        SCM_ENV: "{{ENV}}"
        SCM_BACKEND: snowflake
        SNOWFLAKE_WAREHOUSE: "SCM_WH_{{ENV_UPPER}}"
      readinessProbe:
        port: 8000
        path: /health
      resources:
        requests:
          cpu: "0.5"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
  endpoints:
    - name: strata-api
      port: 8000
      public: true
  logExporters:
    eventTableConfig:
      logLevel: INFO
  platformMonitor:
    metricConfig:
      groups:
        - system
        - network
