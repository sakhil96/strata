  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    METRICS po_lines.landed_cost_per_unit\n    WHERE\
    \ po_lines.period_month BETWEEN '2026-08-01' AND '2026-09-01'\n)"
  verified_at: 1790812800
  verified_by: Procurement Analytics Lead
  use_as_onboarding_question: false
- name: q44
  question: Days of inventory for packaging
  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    METRICS inventory.days_of_inventory\n    WHERE inventory.period_month\
    \ BETWEEN '2026-09-01' AND '2026-09-01'\n      AND parts.part_family = 'Packaging'\n)"
  verified_at: 1790812800
  verified_by: Inventory Manager
  use_as_onboarding_question: false
- name: q45
  question: Carrier on-time by carrier
  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    DIMENSIONS carriers.carrier_name\n    METRICS shipments.carrier_on_time\n\
    \    WHERE shipments.period_month BETWEEN '2025-10-01' AND '2026-09-01'\n)\nORDER BY carrier_name"
  verified_at: 1790812800
  verified_by: Logistics Analytics Lead
  use_as_onboarding_question: false
- name: q46
  question: OTIF for the industrial segment
  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    METRICS delivered_lines.otif\n    WHERE delivered_lines.period_month\
    \ BETWEEN '2025-10-01' AND '2026-09-01'\n      AND customers.segment = 'Industrial'\n)"
  verified_at: 1790812800
  verified_by: Supply Chain Analytics Lead
  use_as_onboarding_question: false
