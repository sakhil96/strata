      value: VP Supply Chain
    - name:
        database: SCM_DEV
        schema: CONFORMED
        tag: METRIC_STEWARD
      value: Inventory Manager
    - name:
        database: SCM_DEV
        schema: CONFORMED
        tag: METRIC_VERSION
      value: '1'
  - name: doi_units
    synonyms:
    - DOI in units
    - unit days of supply
    description: Days of inventory measured in units rather than value. Grain storage_location_part; dated by snapshot_date;
