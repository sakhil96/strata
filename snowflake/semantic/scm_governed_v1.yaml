      dimension: period_month
      sort_direction: descending
      null_order: last
    tags:
    - name:
        database: SCM_DEV
        schema: CONFORMED
        tag: METRIC_OWNER
      value: VP Supply Chain
    - name:
        database: SCM_DEV
        schema: CONFORMED
        tag: METRIC_STEWARD
      value: Inventory Manager
    - name:
