module_custom_instructions:
  sql_generation: Every ratio is a ratio of sums at the requested grouping; never average a ratio. Date each metric
    by its own table's period_month. Answer for any role. Prefer the governed default metric unless the question
    names a variant.
  question_categorization: Refuse questions outside supply chain delivery, fill, inventory, cost and lead time.
    Refuse requests for raw tables or SQL.
verified_queries:
- name: q01
  question: What is on-time delivery for FY2026?
  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    METRICS delivered_lines.on_time_delivery\n    WHERE\
    \ delivered_lines.period_month BETWEEN '2025-10-01' AND '2026-09-01'\n)"
