        schema: CONFORMED
        tag: METRIC_VERSION
      value: '1'
  - name: dio_financial
    synonyms:
    - DIO
    - days inventory outstanding
    description: Days inventory outstanding on the finance basis, average inventory over cost of sales times days
      in the period. Grain storage_location_part; dated by snapshot_date; unit days.
    expr: SUM(inventory.avg_value_x_days) / NULLIF(SUM(inventory.cogs_month), 0)
    non_additive_dimensions:
    - table: inventory
      dimension: period_month
      sort_direction: descending
      null_order: last
    tags:
    - name:
        database: SCM_DEV
        schema: CONFORMED
        tag: METRIC_OWNER
      value: Finance
    - name:
