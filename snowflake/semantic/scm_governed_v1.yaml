- name: q50
  question: OTD and OTIF by region
  sql: "SELECT * FROM SEMANTIC_VIEW(\n    SCM_GOVERNED_V1\n    DIMENSIONS plants.region\n    METRICS delivered_lines.on_time_delivery,\
    \ delivered_lines.otif\n    WHERE delivered_lines.period_month BETWEEN '2025-10-01' AND '2026-09-01'\n)\nORDER\
    \ BY region"
