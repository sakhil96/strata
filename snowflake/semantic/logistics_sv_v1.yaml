# Generated from ontology/*.yaml by compile.py; edit the registry, not this file.
name: LOGISTICS_SV_V1
database: SCM_DEV
schema: SEMANTIC
description: Persona semantic view for LOGISTICS_ROLE.
metrics:
- name: on_time_delivery
  title: On-Time Delivery
  type: ratio
  definition: The fraction of delivered sales order lines that arrived on or before
    the committed date, excluding cancelled lines.
  formula_text: SUM(CASE WHEN actual_delivery_date <= committed_date THEN 1 ELSE 0
    END) / COUNT(*) WHERE actual_delivery_date IN period AND status != 'CANCELLED'
  grain: sales_order_line
  date_basis: actual_delivery_date
  owner: VP Supply Chain
  steward: Supply Chain Analytics Lead
  version: 1
  synonyms:
  - carrier on-time
  - transit reliability
- name: otif
  title: On-Time In-Full
  type: ratio
  definition: The fraction of delivered sales order lines that were both on time (actual
    <= committed) and in full (first shipment qty >= ordered qty), excluding cancelled
    lines.
  formula_text: "SUM(CASE WHEN actual_delivery_date <= committed_date\n          AND\
    \ first_shipment_qty >= ordered_qty THEN 1 ELSE 0 END)\n/ COUNT(*) WHERE actual_delivery_date\
    \ IN period AND status != 'CANCELLED'"
  grain: sales_order_line
  date_basis: actual_delivery_date
  owner: VP Supply Chain
  steward: Supply Chain Analytics Lead
  version: 1
  synonyms:
  - OTIF
  - complete and on-time
- name: unit_fill_rate
  title: Unit Fill Rate
  type: ratio
  definition: The ratio of units shipped on first shipment to units ordered, measured
    at the requested date, excluding cancelled lines. A measure of immediate availability.
  formula_text: SUM(first_shipment_qty) / SUM(ordered_qty) WHERE requested_date IN
    period AND status != 'CANCELLED'
  grain: sales_order_line
  date_basis: requested_date
  owner: VP Supply Chain
  steward: Demand Planning Manager
  version: 1
  synonyms:
  - shipment completeness
- name: days_of_inventory
  title: Days of Inventory
  type: ratio
  definition: The number of days current on-hand inventory would last at the trailing
    90-day consumption rate. Measured as a ratio of sums at the requested grouping.
  formula_text: SUM(on_hand_value_std at period_end) / (SUM(cogs_shipped over trailing_90_days)
    / 90)
  grain: storage_location_part
  date_basis: snapshot_date
  owner: VP Supply Chain
  steward: Inventory Manager
  version: 1
  synonyms:
  - warehouse days cover
- name: landed_cost_per_unit
  title: Landed Cost Per Unit
  type: weighted_average
  definition: The fully loaded cost per unit of received goods, including material,
    freight, duty, insurance and handling, weighted by received quantity.
  formula_text: SUM(material_cost + freight_allocation + duty_cost + insurance + handling)
    / SUM(received_qty) WHERE receipt_date IN period
  grain: purchase_order_line
  date_basis: receipt_date
  owner: VP Procurement
  steward: Procurement Analytics Lead
  version: 1
  synonyms:
  - delivered cost
- name: supplier_lead_time_days
  title: Supplier Lead Time
  type: percentile
  definition: Median and 90th percentile calendar days from PO order date to goods
    receipt date.
  formula_text: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY DATEDIFF(DAY, order_date,
    receipt_date)) and PERCENTILE_CONT(0.9) ...
  grain: purchase_order_line
  date_basis: receipt_date
  owner: VP Procurement
  steward: Procurement Analytics Lead
  version: 1
  synonyms:
  - inbound lead time
- name: order_fulfilment_cycle_days
  title: Order Fulfilment Cycle Time
  type: percentile
  definition: Median calendar days from sales order placement to customer delivery.
  formula_text: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY DATEDIFF(DAY, order_date,
    actual_delivery_date))
  grain: sales_order_line
  date_basis: actual_delivery_date
  owner: VP Supply Chain
  steward: Supply Chain Analytics Lead
  version: 1
  synonyms:
  - order cycle
- name: transit_hours
  title: Transit Time
  type: percentile
  definition: Median and 90th percentile hours from shipment departure to delivery.
  formula_text: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY DATEDIFF(HOUR, ship_date,
    actual_delivery))
  grain: shipment
  date_basis: actual_delivery
  owner: VP Logistics
  steward: Logistics Analytics Lead
  version: 1
  synonyms:
  - transit hours
  - transit time
- name: inventory_turns
  title: Inventory Turns
  type: ratio
  definition: 'The number of times inventory turns over per year, based on trailing
    90-day consumption and average inventory. Invariant: inventory_turns * days_of_inventory
    = 365.'
  formula_text: (SUM(cogs_shipped_90d) / 90 * 365) / AVG(on_hand_value_std_90d)
  grain: storage_location_part
  date_basis: snapshot_date
  owner: VP Supply Chain
  steward: Inventory Manager
  version: 1
  synonyms:
  - warehouse turns
- name: stockout_rate
  title: Stockout Rate
  type: ratio
  definition: Fraction of location-part-day observations where demand exists but on-hand
    inventory is zero.
  formula_text: SUM(CASE WHEN on_hand_qty = 0 AND allocated_qty > 0 THEN 1 ELSE 0
    END) / COUNT(*)
  grain: storage_location_part
  date_basis: snapshot_date
  owner: VP Supply Chain
  steward: Inventory Manager
  version: 1
  synonyms:
  - stockout
- name: freight_cost_per_unit
  title: Freight Cost Per Unit
  type: weighted_average
  definition: Freight cost per unit shipped, allocated by chargeable weight share,
    weighted by shipped quantity.
  formula_text: SUM(freight_allocation) / SUM(shipped_qty) WHERE ship_date IN period
  grain: shipment_line
  date_basis: ship_date
  owner: VP Logistics
  steward: Logistics Analytics Lead
  version: 1
  synonyms:
  - freight cost per unit
  - shipping cost
