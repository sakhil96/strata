# Who sees which rows and which governed columns. Compiled by ontology/compile.py into
# GOV.ENTITLEMENTS and GOV.COLUMN_VISIBILITY, into one secure view per table in SEMANTIC_BASE
# (Standard edition), and into row access and masking policies (Enterprise edition).
#
# scope: "*" for every row, or {plant: [...]} / {region: [...]}. A role with no entry sees nothing.
# Columns not listed are shown to every role that can see the row.

roles:
  SCM_ADMIN: {scope: "*"}
  SCM_DEPLOY: {scope: "*"}
  EXECUTIVE_ROLE: {scope: "*"}
  # The three personas share one scope: the same question must return the same number for each.
  PLANNING_ROLE: {scope: "*"}
  PROCUREMENT_ROLE: {scope: "*"}
  LOGISTICS_ROLE: {scope: "*"}
  JUDGE_ROLE: {scope: "*"}
  # The service user's own role. SCM_READER carries no scope: every persona inherits it, and
  # IS_ROLE_IN_SESSION sees inherited roles, so a scope on it would widen every persona.
  SCM_SERVICE_ROLE: {scope: "*"}
  # A regional planner: the row scope that a persona restriction would use.
  EMEA_PLANNING_ROLE: {scope: {region: [EMEA]}}

# Tables whose rows carry a plant. Every other table is unscoped.
scoped_by_plant: [FCT_SALES_ORDER_LINE, FCT_SHIPMENT, FCT_SHIPMENT_LINE, FCT_PO_LINE, FCT_INVENTORY_MONTH, DIM_PLANT]

# rule: show to the listed roles; everyone else gets `otherwise` (masked for text, null for numbers).
columns:
  DIM_SUPPLIER.CONTACT_NAME: {sensitivity: CONFIDENTIAL, show: [SCM_ADMIN, EXECUTIVE_ROLE], otherwise: masked}
  DIM_SUPPLIER.CONTACT_EMAIL: {sensitivity: CONFIDENTIAL, show: [SCM_ADMIN, EXECUTIVE_ROLE], otherwise: masked}
  DIM_SUPPLIER.BANK_ACCOUNT: {sensitivity: RESTRICTED, show: [SCM_ADMIN, PROCUREMENT_ROLE], otherwise: masked}
  DIM_CUSTOMER.CONTACT_NAME: {sensitivity: CONFIDENTIAL, show: [SCM_ADMIN, EXECUTIVE_ROLE], otherwise: masked}
  DIM_CUSTOMER.CONTACT_EMAIL: {sensitivity: CONFIDENTIAL, show: [SCM_ADMIN, EXECUTIVE_ROLE], otherwise: masked}
  # Exposed so the rule is visible: buyers read the agreed cost, logistics reads null through
  # the same dimension. No metric reads it, so no expression or hash moves.
  FCT_PO_LINE.UNIT_COST: {sensitivity: RESTRICTED, show: [SCM_ADMIN, PROCUREMENT_ROLE], otherwise: "null",
                          expose: {as: supplier_unit_cost, in: [PROCUREMENT_SV, LOGISTICS_SV]}}
  FCT_SHIPMENT.FREIGHT_CHARGE: {sensitivity: RESTRICTED, show: [SCM_ADMIN, PROCUREMENT_ROLE], otherwise: "null"}
