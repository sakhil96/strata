metrics:
- name: carrier_on_time
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(shipments.is_on_eta) / NULLIF(SUM(shipments.is_delivered), 0)
  description: Share of delivered shipments that arrived on or before the carrier's own estimate.
  ai_context:
    synonyms:
    - carrier on-time
    - carrier OTD
    - on time to ETA
    instructions: SUM(is_on_eta) / SUM(is_delivered), shipments dated by actual_delivery.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Logistics", "status": "approved", "steward": "Logistics Analytics Lead", "version": 1}'
- name: days_of_inventory
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(inventory.on_hand_value_end) / NULLIF(SUM(inventory.cogs_daily_90d), 0)
  description: How many days the month-end on-hand stock would last at the trailing 90-day rate of shipments.
  ai_context:
    synonyms:
    - DOI
    - days on hand
    - days of supply
    instructions: SUM(on_hand_value_end) / (SUM(cogs_90d) / 90), ratio of sums at the requested grouping.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Inventory Manager", "version": 1}'
- name: dio_financial
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(inventory.avg_value_x_days) / NULLIF(SUM(inventory.cogs_month), 0)
  description: Days inventory outstanding on the finance basis, average inventory over cost of sales times days
    in the period.
  ai_context:
    synonyms:
    - DIO
    - days inventory outstanding
    instructions: SUM(avg_inventory_value * days_in_period) / SUM(cost_of_sales).
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "Finance", "status": "approved", "steward": "Financial Planning Lead", "version": 1}'
- name: doi_units
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(inventory.on_hand_qty_end) / NULLIF(SUM(inventory.units_daily_90d), 0)
  description: Days of inventory measured in units rather than value.
  ai_context:
    synonyms:
    - DOI in units
    - unit days of supply
    instructions: SUM(on_hand_qty_end) / (SUM(units_90d) / 90).
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Inventory Manager", "version": 1}'
- name: freight_cost_per_unit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(shipment_lines.freight_alloc_usd) / NULLIF(SUM(shipment_lines.shipped_qty), 0)
  description: Outbound freight cost in USD for each unit shipped, weighted by units.
  ai_context:
    synonyms:
    - freight cost
    - shipping cost per unit
    - transport cost per unit
    instructions: SUM(freight_alloc_usd) / SUM(shipped_qty), dated by ship_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Logistics", "status": "approved", "steward": "Logistics Analytics Lead", "version": 1}'
- name: inventory_turns
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(inventory.cogs_annual_90d) / NULLIF(SUM(inventory.on_hand_value_end), 0)
  description: How many times a year the month-end stock turns over at the trailing 90-day shipment rate.
  ai_context:
    synonyms:
    - turns
    - stock turns
    - inventory turnover
    instructions: (SUM(cogs_90d) / 90 * 365) / SUM(on_hand_value_end); inventory_turns x days_of_inventory = 365.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Inventory Manager", "version": 1}'
- name: landed_cost_per_unit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(po_lines.landed_usd) / NULLIF(SUM(po_lines.received_qty), 0)
  description: Fully loaded USD cost of each received unit, weighted by received quantity.
  ai_context:
    synonyms:
    - landed cost
    - total acquisition cost
    - all-in cost
    instructions: SUM(material + freight + duty + insurance + handling) / SUM(received_qty), dated by receipt_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Procurement", "status": "approved", "steward": "Procurement Analytics Lead", "version":
      1}'
- name: lead_time_variability
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: STDDEV_SAMP(po_lines.lead_days)
  description: Sample standard deviation of supplier lead time in days; how far a planner can trust the median.
  ai_context:
    synonyms:
    - lead time variability
    - lead time spread
    - lead time standard deviation
    instructions: STDDEV_SAMP(receipt_date - order_date) over received lines, dated by receipt_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Procurement", "status": "approved", "steward": "Procurement Analytics Lead", "version":
      1}'
- name: line_fill_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(requested_lines.is_line_filled) / NULLIF(SUM(requested_lines.is_live), 0)
  description: Share of order lines filled completely on the first shipment.
  ai_context:
    synonyms:
    - line fill
    - line fill rate
    instructions: SUM(is_line_filled) / SUM(is_live), dated by requested_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Demand Planning Manager", "version": 1}'
- name: on_time_delivery
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(delivered_lines.is_on_time) / NULLIF(SUM(delivered_lines.is_delivered), 0)
  description: Share of delivered sales order lines that arrived on or before the date we committed to the customer.
  ai_context:
    synonyms:
    - OTD
    - on-time delivery rate
    - delivery performance
    instructions: SUM(is_on_time) / SUM(is_delivered), lines dated by actual_delivery_date, cancelled lines excluded
      from both.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Supply Chain Analytics Lead", "version":
      1}'
- name: on_time_to_request
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(delivered_lines.is_on_time_to_request) / NULLIF(SUM(delivered_lines.is_delivered), 0)
  description: Share of delivered sales order lines that arrived on or before the date the customer asked for.
  ai_context:
    synonyms:
    - on-time to request
    - OTR
    - on time to customer request
    instructions: SUM(is_on_time_to_request) / SUM(is_delivered), dated by actual_delivery_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Supply Chain Analytics Lead", "version":
      1}'
- name: order_fill_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(requested_lines.is_order_filled) / NULLIF(SUM(requested_lines.is_order_head), 0)
  description: Share of orders where every line was filled completely on the first shipment.
  ai_context:
    synonyms:
    - order fill
    - complete orders
    - orders were completely filled
    - orders completely filled
    instructions: SUM(is_order_filled) / SUM(is_order_head), counted once per order on its first live line.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Demand Planning Manager", "version": 1}'
- name: order_fulfilment_cycle_days
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MEDIAN(delivered_lines.cycle_days)
  description: Median calendar days from a customer placing an order line to receiving it.
  ai_context:
    synonyms:
    - cycle time
    - order-to-delivery
    - order cycle time
    instructions: MEDIAN(actual_delivery_date - order_date), dated by actual_delivery_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Supply Chain Analytics Lead", "version":
      1}'
- name: otif
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(delivered_lines.is_otif) / NULLIF(SUM(delivered_lines.is_delivered), 0)
  description: Share of delivered sales order lines that were on time to commit and complete on the first shipment.
  ai_context:
    synonyms:
    - OTIF
    - on-time in-full
    - perfect delivery
    instructions: SUM(is_otif) / SUM(is_delivered), dated by actual_delivery_date.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: '{"owner": "VP Supply Chain", "status": "approved", "steward": "Supply Chain Analytics Lead", "version":
      1}'
- name: stockout_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(inventory.stockout_days) / NULLIF(SUM(inventory.obs_days), 0)
  description: Share of location-part-days with demand allocated but nothing on hand.
  ai_context:
    synonyms:
    - stockout frequency
    - out-of-stock rate
