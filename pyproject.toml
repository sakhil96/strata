[project]
name = "scm-ontology"
version = "1.0.0"
description = "Supply chain ontology compiled into governed Snowflake semantic views"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.1",
    "cryptography>=44,<46",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "snowflake-connector-python>=3.12,<4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
data = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=17", "xlrd>=2.0"]
build = ["dbt-core>=1.8,<1.9", "dbt-duckdb>=1.8,<1.9", "dbt-snowflake>=1.8,<1.9", "linkml>=1.8"]
dev = ["cyclonedx-bom>=4.5", "pip-audit>=2.7", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ontology/generated", "web", "cube/model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["api", "semantic", "resolver", "compile", "scoring", "legacy"]

[tool.pytest.ini_options]
testpaths = ["ontology/tests", "api/tests", "eval"]
pythonpath = ["ontology", "eval", "."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["ontology", "api", "snowflake/procs"]
omit = ["ontology/generated/*", "*/tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ontology"]
