# Persona consistency: each case is one question asked three ways, each in its role's own words
# from the registry's persona_synonyms. All three must resolve to this query, hash and number.
cases:
- id: pc01
  phrasings:
    PLANNING_ROLE: What is our delivery rate for FY2026?
    PROCUREMENT_ROLE: What is our customer delivery performance for FY2026?
    LOGISTICS_ROLE: What is our delivery reliability for FY2026?
  query:
    metrics:
    - on_time_delivery
    dimensions: []
    time:
      range: fy2026
    filters: []
- id: pc02
  phrasings:
    PLANNING_ROLE: Delivery rate by region
    PROCUREMENT_ROLE: Customer delivery performance by region
    LOGISTICS_ROLE: Delivery reliability by region
  query:
    metrics:
    - on_time_delivery
    dimensions:
    - region
    time:
      range: fy2026
    filters: []
- id: pc03
  phrasings:
    PLANNING_ROLE: Delivery rate for the Retail segment in Q4
    PROCUREMENT_ROLE: Customer delivery performance for the Retail segment in Q4
    LOGISTICS_ROLE: Delivery reliability for the Retail segment in Q4
  query:
    metrics:
    - on_time_delivery
    dimensions: []
    time:
      range: q4
    filters:
    - dimension: segment
      operator: '='
      value: Retail
- id: pc04
  phrasings:
    PLANNING_ROLE: Perfect delivery by month
    PROCUREMENT_ROLE: OTIF by month
    LOGISTICS_ROLE: Complete and on-time by month
  query:
    metrics:
    - otif
    dimensions:
    - period_month
    time:
      range: fy2026
    filters: []
- id: pc05
  phrasings:
    PLANNING_ROLE: Perfect delivery for the Industrial segment
    PROCUREMENT_ROLE: OTIF for the Industrial segment
    LOGISTICS_ROLE: Complete and on-time for the Industrial segment
  query:
    metrics:
    - otif
    dimensions: []
    time:
      range: fy2026
    filters:
    - dimension: segment
      operator: '='
      value: Industrial
- id: pc06
  phrasings:
    PLANNING_ROLE: What was availability in Q3?
    PROCUREMENT_ROLE: What was unit fill in Q3?
    LOGISTICS_ROLE: What was shipment completeness in Q3?
