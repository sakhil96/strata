    time:
      range: fy2026
    filters: []
- id: pc08
  phrasings:
    PLANNING_ROLE: What are our days of supply?
    PROCUREMENT_ROLE: What are our stock days?
    LOGISTICS_ROLE: What are our warehouse days cover?
