# Local run of the same image against the DuckDB build: `make data dbt-local web` first.
services:
  strata:
    build: .
    ports: ["8000:8000"]
    environment:
      SCM_BACKEND: local
      SCM_DUCKDB: /data/scm.duckdb
      SCM_STATE_DIR: /tmp/strata
    volumes:
      - ./dbt/target/scm.duckdb:/data/scm.duckdb:ro
      - ./data/out:/app/data/out:ro
    read_only: true
    tmpfs: [/tmp]
